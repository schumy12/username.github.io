name: Build Calciolitario 1.0.1 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calciolitario-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q calciolitario-android/calciolitario_101_buildsrc.zip -d buildsrc
      - name: Build release APK
        run: |
          cd buildsrc/Calciolitario_Android
          gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Calciolitario-1.0.1-unsigned
          path: buildsrc/Calciolitario_Android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
