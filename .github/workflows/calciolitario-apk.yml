name: Build Calciolitario APK

on:
  push:
    branches: [ calciolitario-android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calciolitario-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Calciolitario-APK
          path: |
            calciolitario-android/app/build/outputs/apk/debug/app-debug.apk
            calciolitario-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
