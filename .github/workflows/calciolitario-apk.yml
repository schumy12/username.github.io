name: Build Calciolitario APK

on:
  push:
    branches: [ calciolitario-android ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calciolitario-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APKs
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Bundle signing tools
        if: always()
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          LIBCPP=$(find "$ANDROID_HOME/build-tools/35.0.0" -name 'libc++.so' -print -quit)
          if [ -n "$LIBCPP" ]; then cp "$LIBCPP" signing-tools/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Calciolitario-build-output
          path: |
            calciolitario-android/build.log
            calciolitario-android/app/build/outputs/apk/debug/app-debug.apk
            calciolitario-android/app/build/outputs/apk/release/app-release-unsigned.apk
            calciolitario-android/signing-tools
          if-no-files-found: warn
