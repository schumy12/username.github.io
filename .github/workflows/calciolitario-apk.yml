name: Build Calciolitario 1.0.1 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: calciolitario-android
      - name: Restore and verify Android project
        shell: bash
        run: |
          cat > expected.sha <<'EOF'
          baaded657108305eecd28694e8ee0ba2223594c8b08e932d75e4951e6b9c292f  .buildsrc/part00
          d17ab489497ad69f402eb48b1ce10e4ad200d1692ed60bc278d1c2c2c9544be4  .buildsrc/part01
          3ba1c64435e4ad41c2f5ac647779f6da46b08d9590ad0532cb283ebcac0ebba7  .buildsrc/part02
          33b258fc00bbeddeeda175ab5cdf347a9af87b64b4ea302cdee286bc5d4145d0  .buildsrc/part03
          29b086e84dccf2c9edc71e261511dc8e1c3751b2f0245bfbf997fa5c125dda2d  .buildsrc/part04
          e1d9a406547959e564d5815fedadd31142568e50fc0adf7dc3ccf0c4c48c6fdd  .buildsrc/part05
          6f0cea339496dbb89b0c9f18bb6e56e2010e2dafbaf39f1ad0f371e2887e3938  .buildsrc/part06
          EOF
          wc -c .buildsrc/part*
          sha256sum -c expected.sha
          cat .buildsrc/part00 .buildsrc/part01 .buildsrc/part02 .buildsrc/part03 .buildsrc/part04 .buildsrc/part05 .buildsrc/part06 > buildsrc.b64
          base64 -d buildsrc.b64 > calciolitario_101_buildsrc_small.zip
          echo "17303d2f39d71de6cdbbb6605ab2f5aefff1bd2b3246c942a5576221428e635a  calciolitario_101_buildsrc_small.zip" | sha256sum -c -
          unzip -q calciolitario_101_buildsrc_small.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        shell: bash
        run: |
          cd Calciolitario_Android
          gradle :app:assembleRelease --stacktrace
      - name: Bundle Android signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          if [ -f "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" ]; then
            cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" signing-tools/
          elif [ -f "$ANDROID_HOME/emulator/lib64/libc++.so" ]; then
            cp "$ANDROID_HOME/emulator/lib64/libc++.so" signing-tools/
          else
            find "$ANDROID_HOME" -name 'libc++.so' -type f -print -quit | xargs -r -I{} cp "{}" signing-tools/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Calciolitario-1.0.1-build
          path: |
            Calciolitario_Android/app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools
          if-no-files-found: error
