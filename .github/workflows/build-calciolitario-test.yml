name: Build Calciolitario TEST APK

on:
  push:
    branches: [ calciolitario-test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production wrapper source
        uses: actions/checkout@v4
        with:
          ref: calciolitario-android
          path: prod

      - name: Checkout test payload
        uses: actions/checkout@v4
        with:
          ref: calciolitario-test
          path: test

      - name: Restore verified Android wrapper
        shell: bash
        run: |
          cd prod
          cat > expected.sha <<'EOF'
          baaded657108305eecd28694e8ee0ba2223594c8b08e932d75e4951e6b9c292f  .buildsrc/part00
          d17ab489497ad69f402eb48b1ce10e4ad200d1692ed60bc278d1c2c2c9544be4  .buildsrc/part01
          3ba1c64435e4ad41c2f5ac647779f6da46b08d9590ad0532cb283ebcac0ebba7  .buildsrc/part02
          33b258fc00bbeddeeda175ab5cdf347a9af87b64b4ea302cdee286bc5d4145d0  .buildsrc/part03
          12569f64f3f5f657d5d40b1b52da5d269686a6fc39e99efe4304a9a170de8421  .buildsrc/part04_0
          4c94f16712b58398e26d41030a806338ed89da59126e4724378b6620c2590bb1  .buildsrc/part04_1
          e605183e753c9ff68b0fd3624848af5d924461412a37dedc3f04be3282b129c6  .buildsrc/part04_2
          fa800291f8a80e6bcac83242c499798b31f9b8c16f95c979759f968dc7d238af  .buildsrc/part04_3_0
          b2d00f167618bb44da2e0e892fc5c455abc4c29c7943bc520dbea500a5dbc4b2  .buildsrc/part04_3_1
          74fd60037cca7343edf04db2192cbb30db984a0b5fd29e5c8d447d2341b5931a  .buildsrc/part04_3_2
          2a5de28a9c6b12b35812cedb09311bef153e9d7593b769b4683b7246a3e623ea  .buildsrc/part04_3_3_0
          273e65b9f6998f1baab19645c89657c7c041cd0e4316c5d2387da215b2ebd438  .buildsrc/part04_3_3_1
          f51c8b4c8c4dc3b7cb9e73127517dde224743699aa552dd2e46ad51acf34b5d9  .buildsrc/part04_3_3_2
          54a86cd2ea3cd78000acf87c7e20d09e738b2c748fad32110b8252c13178cb08  .buildsrc/part04_3_3_3
          92323e26387c545610c290d622226112ebcdc122ea3a3749395ca26f2eab3949  .buildsrc/part04_3_3_4
          1abc70cafe58333e6d79186e6d512684ef579072ada2f1beda43f18f56d0efc1  .buildsrc/part04_3_4
          78d89db27a0409a9a7671303db24f7cbec4957f7e3cc28f11f11bc075d22bae4  .buildsrc/part04_3_5
          e1d9a406547959e564d5815fedadd31142568e50fc0adf7dc3ccf0c4c48c6fdd  .buildsrc/part05
          6f0cea339496dbb89b0c9f18bb6e56e2010e2dafbaf39f1ad0f371e2887e3938  .buildsrc/part06
          EOF
          sha256sum -c expected.sha
          cat .buildsrc/part00 .buildsrc/part01 .buildsrc/part02 .buildsrc/part03 .buildsrc/part04_0 .buildsrc/part04_1 .buildsrc/part04_2 .buildsrc/part04_3_0 .buildsrc/part04_3_1 .buildsrc/part04_3_2 .buildsrc/part04_3_3_0 .buildsrc/part04_3_3_1 .buildsrc/part04_3_3_2 .buildsrc/part04_3_3_3 .buildsrc/part04_3_3_4 .buildsrc/part04_3_4 .buildsrc/part04_3_5 .buildsrc/part05 .buildsrc/part06 > buildsrc.b64
          base64 -d buildsrc.b64 > calciolitario-wrapper.zip
          echo "17303d2f39d71de6cdbbb6605ab2f5aefff1bd2b3246c942a5576221428e635a  calciolitario-wrapper.zip" | sha256sum -c -
          unzip -q calciolitario-wrapper.zip

      - name: Install TEST HTML and native bridge
        shell: bash
        run: |
          echo "21ff5b0180b67df30da9872da15ae90e3b60c21f7823ecd63f7ab8c793f283c2  test/.calciolitario-test/html00" | sha256sum -c -
          echo "83a7e7c599be88cc09133bf85cf52771a672242801a19311877808a742edb9e6  test/.calciolitario-test/html01" | sha256sum -c -
          echo "48db343ee21fb2dd64315579a9ecd5928dfabad2a7eb88e8611c39ac9e21058a  test/.calciolitario-test/html02" | sha256sum -c -
          cat test/.calciolitario-test/html00 test/.calciolitario-test/html01 test/.calciolitario-test/html02 > test-html.gz.b64
          base64 -d test-html.gz.b64 > test-html.gz
          echo "521cb2456dfc147b27f1bd12caebe949367f09549714b1a73562ce6e537f8598  test-html.gz" | sha256sum -c -
          gzip -dc test-html.gz > prod/Calciolitario_Android/app/src/main/assets/index.html
          echo "f9a5859b963aa044b6a720dc0136b5a3ffb179d82bc703cfde39f89ab89c760a  prod/Calciolitario_Android/app/src/main/assets/index.html" | sha256sum -c -
          cp test/.calciolitario-test/MainActivity.java prod/Calciolitario_Android/app/src/main/java/it/calciolitario/app/MainActivity.java
          sed -i "s/applicationId 'it.calciolitario.app'/applicationId 'it.calciolitario.test'/" prod/Calciolitario_Android/app/build.gradle
          sed -i "s/versionCode 2/versionCode 1/" prod/Calciolitario_Android/app/build.gradle
          sed -i "s/versionName '1.0.1'/versionName 'test-1.0'/" prod/Calciolitario_Android/app/build.gradle
          sed -i 's/android:label="Calciolitario"/android:label="Calciolitario TEST"/' prod/Calciolitario_Android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' prod/Calciolitario_Android/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build TEST release APK
        shell: bash
        run: |
          cd prod/Calciolitario_Android
          gradle :app:assembleRelease --stacktrace

      - name: Bundle signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          if [ -f "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" ]; then
            cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" signing-tools/
          elif [ -f "$ANDROID_HOME/emulator/lib64/libc++.so" ]; then
            cp "$ANDROID_HOME/emulator/lib64/libc++.so" signing-tools/
          else
            find "$ANDROID_HOME" -name 'libc++.so' -type f -print -quit | xargs -r -I{} cp "{}" signing-tools/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Calciolitario-TEST-Multiplayer
          path: |
            prod/Calciolitario_Android/app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools
          if-no-files-found: error
