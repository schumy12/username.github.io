plugins {
    id 'com.android.application'
}

android {
    namespace 'it.calciolitario.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.calciolitario.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
